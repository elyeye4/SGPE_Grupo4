<head th:fragment="head">
    <title>SGPE</title>

    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1"/>

    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet"/>

    <link th:href="@{/webjars/font-awesome/css/all.css}"
          rel="stylesheet"/>

    <link th:href="@{/css/estilos.css}"
          rel="stylesheet"/>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
    </script>

    <script th:src="@{/webjars/jquery/jquery.min.js}">
    </script>

    <script th:src="@{/js/rutinas.js}">
    </script>
</head>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-sgpe">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center"
               th:href="@{/}">
                <span class="logo-sgpe">S</span>
                <span>SGPE</span>
            </a>

            <div th:if="${usuarioAutenticado}"
                 class="d-flex align-items-center gap-3">

                <span th:text="${nombreUsuario}"></span>

                <form th:action="@{/logout}"
                      method="post"
                      class="mb-0">

                    <button type="submit"
                            class="btn btn-outline-primary btn-sm">
                        [[#{plantilla.cerrarSesion}]]
                    </button>

                </form>
            </div>

        </div>
    </nav>
</header>

<footer th:fragment="footer"
        class="footer-sgpe py-3 mt-5">
    <div class="container">
        <p class="mb-0 small">
            SGPE · Sistema de Gestión de Préstamos de Equipos
        </p>
    </div>
</footer>
